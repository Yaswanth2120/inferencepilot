[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inferencepilot"
version = "0.0.1"
description = "Offline-first orchestration for defensible vLLM comparisons"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["pydantic>=2,<3", "pyyaml>=6,<7", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
report = ["matplotlib>=3.8,<4"]
live = ["lm-eval[api]==0.4.9.2"]

[project.scripts]
inferencepilot = "inferencepilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"inferencepilot.fakes" = ["fake_bin/vllm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: requires a real GPU and vLLM (skipped by default)"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "PLW1510"]
