name: offline
on:
  push:
    branches: [main, feature/m1-config-planner]
  pull_request:
permissions:
  contents: read
concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,report]'
      - name: Check installed release version
        run: |
          inferencepilot --version
          python -c "from importlib.metadata import version; from inferencepilot import __version__; assert version('inferencepilot') == __version__"
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: ruff check .
      - run: pytest
      - run: inferencepilot selftest
